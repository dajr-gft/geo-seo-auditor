};

const derive=d=>{
  const alw=d.crawlers.filter(c=>c.status).length,blk=d.crawlers.length-alw;
  const critBlk=d.crawlers.filter(c=>!c.status&&c.critical).length;
  const totImpact=d.quick_wins.reduce((s,w)=>s+w.pts,0);
  const proj=Math.min(100,d.geo_score+totImpact);
  const delta=d.previous_score?d.geo_score-d.previous_score:null;
  const gap=d.top_competitor.score-d.geo_score;
  const totBlocks=Object.values(d.grades).reduce((a,b)=>a+b,0);
  const citable=(d.grades.A||0)+(d.grades.B||0)+(d.grades.C||0);
  const citRatio=totBlocks>0?Math.round(citable/totBlocks*100):0;
  return{alw,blk,critBlk,totImpact,proj,delta,gap,totBlocks,citable,citRatio};
};

/* ─── Markdown renderer (bold, italic, code, links, lists, headings, tables, codeblocks) ─── */
const _mdInline=s=>{
  if(!s)return'';
  const parts=[];let last=0;
  const re=/(\*\*(.+?)\*\*|\*(.+?)\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\))/g;
  let m;
  while((m=re.exec(s))!==null){
    if(m.index>last)parts.push(s.slice(last,m.index));
    const k='i'+m.index;
    if(m[2])parts.push(React.createElement('strong',{key:k},m[2]));
    else if(m[3])parts.push(React.createElement('em',{key:k},m[3]));
    else if(m[4])parts.push(React.createElement('code',{key:k,style:{background:'rgba(255,255,255,.09)',borderRadius:4,padding:'1px 6px',fontSize:'0.87em',fontFamily:'monospace',color:'#c9d1d9'}},m[4]));
    else if(m[5])parts.push(React.createElement('a',{key:k,href:m[6],target:'_blank',rel:'noopener',style:{color:'#4a9eff',textDecoration:'underline',textDecorationColor:'#4a9eff40'}},m[5]));
    last=m.index+m[0].length;
  }
  if(last<s.length)parts.push(s.slice(last));
  return parts.length?parts:s;
};
function parseMd(text){
  if(!text)return null;
  const elems=[];
  const lines=text.split('\n');
  let j=0;
  while(j<lines.length){
    const line=lines[j];
    // Heading
    const hm=line.match(/^(#{1,3})\s+(.+)/);
    if(hm){const sz=[17,14,13][hm[1].length-1];elems.push(React.createElement('div',{key:'h'+j,style:{fontWeight:700,fontSize:sz,marginTop:j===0?0:10,marginBottom:4,color:'#e8ecf4',borderBottom:hm[1].length===1?'1px solid rgba(255,255,255,.08)':'none',paddingBottom:hm[1].length===1?6:0}},_mdInline(hm[2])));j++;continue;}
    // Code block
    if(line.startsWith('```')){j++;const cl=[];while(j<lines.length&&!lines[j].startsWith('```')){cl.push(lines[j]);j++;}j++;elems.push(React.createElement('pre',{key:'cb'+j,style:{background:'#0d1117',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,padding:'10px 14px',fontSize:11,fontFamily:'monospace',overflowX:'auto',margin:'6px 0',color:'#c9d1d9',lineHeight:1.55,whiteSpace:'pre'}},cl.join('\n')));continue;}
    // Table
    if(line.includes('|')&&j+1<lines.length&&lines[j+1].match(/^\|[\s\-|:]+\|/)){
      const hdrs=line.split('|').filter(c=>c.trim()).map(c=>c.trim());
      j+=2;
      const rows=[];
      while(j<lines.length&&lines[j].includes('|')){rows.push(lines[j].split('|').filter(c=>c.trim()).map(c=>c.trim()));j++;}
      elems.push(React.createElement('div',{key:'tbl'+j,style:{overflowX:'auto',margin:'8px 0',borderRadius:8,border:'1px solid rgba(255,255,255,.1)'}},
        React.createElement('table',{style:{borderCollapse:'collapse',width:'100%',fontSize:12}},
          React.createElement('thead',null,React.createElement('tr',null,hdrs.map((h,hi)=>React.createElement('th',{key:hi,style:{padding:'7px 12px',textAlign:'left',background:'rgba(255,255,255,.05)',borderBottom:'1px solid rgba(255,255,255,.1)',color:'#a0aec0',fontWeight:600,whiteSpace:'nowrap'}},_mdInline(h))))),
          React.createElement('tbody',null,rows.map((row,ri)=>React.createElement('tr',{key:ri,style:{background:ri%2===0?'transparent':'rgba(255,255,255,.02)'}},row.map((cell,ci)=>React.createElement('td',{key:ci,style:{padding:'6px 12px',borderBottom:'1px solid rgba(255,255,255,.05)',color:'#e8ecf4',verticalAlign:'top'}},_mdInline(cell))))))
        )
      ));
      continue;
    }
    // Bullet
    const bm=line.match(/^[\-\*]\s+(.+)/);
    if(bm){elems.push(React.createElement('div',{key:'b'+j,style:{display:'flex',gap:8,margin:'3px 0',paddingLeft:4}},React.createElement('span',{style:{color:'#4a9eff',flexShrink:0,marginTop:3,fontSize:8}},'◆'),React.createElement('span',{style:{lineHeight:1.65}},_mdInline(bm[1]))));j++;continue;}
    // Numbered list
    const nm=line.match(/^(\d+)\.\s+(.+)/);
    if(nm){elems.push(React.createElement('div',{key:'n'+j,style:{display:'flex',gap:8,margin:'3px 0',paddingLeft:4}},React.createElement('span',{style:{color:'#4a9eff',flexShrink:0,fontFamily:'monospace',fontSize:'0.88em',minWidth:18,marginTop:1}},nm[1]+'.'),React.createElement('span',{style:{lineHeight:1.65}},_mdInline(nm[2]))));j++;continue;}
    // Blank line
    if(line.trim()===''){elems.push(React.createElement('div',{key:'br'+j,style:{height:6}}));j++;continue;}
    // Paragraph
    elems.push(React.createElement('p',{key:'p'+j,style:{margin:'3px 0',lineHeight:1.7}},_mdInline(line)));
    j++;
  }

          React.createElement('div',{style:{
            width:isMobile?36:44,height:isMobile?36:44,borderRadius:12,flexShrink:0,

          React.createElement('div',{style:{flex:1,minWidth:0}},
            React.createElement('div',{style:{fontSize:isMobile?13:15,fontWeight:700,letterSpacing:-.3}},'Letícia'),
            React.createElement('div',{style:{fontSize:11,marginTop:2,display:'flex',alignItems:'center',gap:5}},
              React.createElement('span',{style:{
                width:6,height:6,borderRadius:'50%',flexShrink:0,display:'inline-block',
                background:chatLoading?C.amber:C.green,
                boxShadow:`0 0 6px ${chatLoading?C.amber:C.green}`,
              }}),
              React.createElement('span',{style:{color:chatLoading?C.amber:C.green,fontWeight:500}},chatLoading?'digitando...':'online'),
              !isMobile&&React.createElement('span',{style:{color:C.text3,marginLeft:4}},'· Analista GEO-SEO sênior · Hotmart')
            )
          ),
          React.createElement('button',{
            onClick:()=>{setChatMessages([{...INITIAL_MSG,ts:Date.now()}]);setChatSessionId('');setCopiedIdx(null);},
            title:'Nova conversa',
            style:{background:'none',border:`1px solid ${C.border}`,color:C.text3,borderRadius:8,padding:isMobile?'7px 10px':'6px 12px',fontSize:11,cursor:'pointer',transition:'all .2s',flexShrink:0,minHeight:36,display:'flex',alignItems:'center',gap:4},
          },isMobile?'↺':'↺ Nova conversa')
        ),

        /* ── Messages ── */
        React.createElement('div',{style:{flex:1,overflowY:'auto',padding:'4px 0',display:'flex',flexDirection:'column',gap:0,WebkitOverflowScrolling:'touch',scrollbarWidth:'thin'}},
          chatMessages.map((msg,i)=>{
            const isUser=msg.role==='user';
            return React.createElement('div',{key:i,style:{
              display:'flex',gap:8,alignItems:'flex-start',padding:'5px 0',

                  padding:isMobile?'9px 12px':'11px 15px',
                  borderRadius:isUser?'16px 4px 16px 16px':'4px 16px 16px 16px',
                  background:isUser?`linear-gradient(135deg,${C.accent},${C.accent2})`:C.card,
                  border:isUser?'none':`1px solid ${C.border}`,
                  fontSize:isMobile?14:13,lineHeight:1.7,color:isUser?'#fff':C.text1,
                  boxShadow:isUser?`0 2px 16px ${C.accent}30`:`0 1px 4px rgba(0,0,0,.3)`,
                  wordBreak:'break-word',
                }},
                  isUser?msg.text:parseMd(msg.text)
                ),
                React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'0 4px'}},
                  React.createElement('span',{style:{fontSize:10,color:C.text3}},_relTime(msg.ts)),
                  !isUser&&React.createElement('button',{
                    onClick:()=>{navigator.clipboard?.writeText(msg.text).then(()=>{setCopiedIdx(i);setTimeout(()=>setCopiedIdx(null),2000);});},
                    title:'Copiar',
                    style:{background:'none',border:'none',color:copiedIdx===i?C.green:C.text3,fontSize:10,cursor:'pointer',padding:'3px 6px',borderRadius:4,transition:'all .2s',minHeight:28},
                  },copiedIdx===i?'✓':'⎘')
                )
              ),
              isUser&&React.createElement('div',{style:{
                width:isMobile?28:32,height:isMobile?28:32,borderRadius:9,flexShrink:0,marginTop:2,
                background:C.surface,border:`1px solid ${C.border}`,
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:isMobile?12:14,color:C.text2,
              }},'◈')
            );
          }),
          chatLoading&&React.createElement('div',{style:{display:'flex',gap:10,alignItems:'flex-start',padding:'6px 0'}},
            React.createElement('div',{style:{
              width:32,height:32,borderRadius:10,flexShrink:0,
              background:`linear-gradient(135deg,${C.accent},${C.accent2})`,
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,
              boxShadow:`0 2px 10px ${C.accent}40`,
            }},'✦'),
            React.createElement('div',{style:{
              padding:'14px 18px',borderRadius:'4px 16px 16px 16px',
              background:C.card,border:`1px solid ${C.border}`,
              display:'flex',gap:5,alignItems:'center',boxShadow:`0 1px 4px rgba(0,0,0,.3)`,
            }},
              [0,1,2].map(j=>React.createElement('span',{key:j,style:{
                width:8,height:8,borderRadius:'50%',display:'inline-block',
                background:C.accent,animation:`pulse 1.4s ease-in-out ${j*0.2}s infinite`,
              }}))
            )
          ),
          React.createElement('div',{ref:chatBottomRef})
        ),

        /* ── Quick suggestions ── */
        React.createElement('div',{
          className:'chat-chips',
          style:{
            padding:'8px 0 4px',display:'flex',gap:6,flexShrink:0,
            flexWrap:isMobile?'nowrap':'wrap',
            overflowX:isMobile?'auto':'visible',
            scrollbarWidth:'none',
          }
        },
          ['GEO Score atual','Findings críticos','Quick wins ROI','Citabilidade','Platforms','Potencial'].map((chip,i)=>
            React.createElement('button',{key:i,onClick:()=>handleChatSend(chip),disabled:chatLoading,style:{
              background:'transparent',border:`1px solid ${C.accent}35`,color:C.accent,

        React.createElement('div',{
          className:'chat-input',
          style:{flexShrink:0,borderTop:`1px solid ${C.border}`,paddingTop:10,display:'flex',gap:8,alignItems:'flex-end'},
        },

            ref:chatInputRef,
            value:chatInput,
            onChange:e=>setChatInput(e.target.value),

          }),
          React.createElement('button',{
            onClick:()=>handleChatSend(),
            disabled:chatLoading||!chatInput.trim(),
            style:{
              background:chatLoading||!chatInput.trim()?C.surface:`linear-gradient(135deg,${C.accent},${C.accent2})`,
              color:chatLoading||!chatInput.trim()?C.text3:'#fff',
              border:`1px solid ${chatLoading||!chatInput.trim()?C.border:C.accent}`,
              borderRadius:12,width:44,height:44,flexShrink:0,
              cursor:chatLoading||!chatInput.trim()?'default':'pointer',

              transition:'all .25s',boxShadow:chatLoading||!chatInput.trim()?'none':`0 2px 12px ${C.accent}40`,

      React.createElement('div',{style:{marginTop:36,paddingTop:14,borderTop:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:10,color:C.text3}},
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6}},React.createElement(Logo,{size:16}),'GEO-SEO Auditor - By Letícia Nonato'),
        React.createElement('span',null,lastUpdate?'Atualizado em '+new Date(lastUpdate).toLocaleDateString('pt-BR'):'Baseline')
      )
    )
  );
}

/* ═══ MAP BACKEND RESULT → DASHBOARD FORMAT ═══ */
function mapBlock(b){return{heading:b.heading,score:b.total_score,grade:b.grade,words:b.word_count,self_contain:b.breakdown?.self_containment*4||50,stat_density:b.breakdown?.statistical_density*6.7||50,answer_quality:b.breakdown?.answer_block_quality*3.3||50,source_url:b.source_url||null}}
function mapAuditResult(r,old){
  const s=r.scores||{};
  const mkScore=(key,label,weight,prev)=>({value:s[key]?.value??s[key]??0,weight,prev:prev,label});
  const oldS=old.scores||{};
  const allBlocks=r.citability?.all_blocks?.map(mapBlock)||[];
  const topBlocks=r.citability?.top_blocks?.map(mapBlock)||[];
  return{
    url:r.url||old.url, brand:r.brand_name||r.brand||old.brand,
    date:r.date||new Date().toISOString().split('T')[0],
    geo_score:r.geo_score||0, previous_score:old.geo_score,
    industry_avg:r.industry_avg||old.industry_avg,
    top_competitor:r.top_competitor||old.top_competitor,
    scores:{
      ai_citability:mkScore('ai_citability','AI Citability',25,oldS.ai_citability?.value),
      brand_authority:mkScore('brand_authority','Brand Authority',20,oldS.brand_authority?.value),
      content_eeat:mkScore('content_eeat','Content E-E-A-T',20,oldS.content_eeat?.value),
      technical:mkScore('technical','Technical SEO',15,oldS.technical?.value),
      schema:mkScore('schema','Schema Markup',10,oldS.schema?.value),
      platform_optim:mkScore('platform_optimization','Platform Optim.',10,oldS.platform_optim?.value),
    },
    platforms:r.platforms?Object.fromEntries(Object.entries(r.platforms).map(([k,v])=>[k,{score:typeof v==='number'?v:v?.score||0,prev:old.platforms?.[k]?.score||null,share:old.platforms?.[k]?.share||10,color:old.platforms?.[k]?.color||'#888'}])):old.platforms,
    crawlers:r.crawlers?.crawlers_list?.map(c=>({name:c.user_agent,platform:c.platform,status:c.status==='ALLOWED',critical:c.critical}))||r.crawlers||old.crawlers,
    grades:r.citability?.grade_distribution||r.grades||old.grades,
    citability_blocks:allBlocks.length>0?allBlocks:topBlocks.length>0?topBlocks:r.citability_blocks||old.citability_blocks,
    findings:r.findings?.map(f=>({sev:f.severity||f.sev,title:f.title,desc:f.description||f.desc,fix:f.fix,effort:f.effort,impact_pts:f.impact_pts||0}))||old.findings,
    quick_wins:r.quick_wins?.map(w=>({action:w.action,pts:w.pts,effort:w.effort,category:w.category||w.severity||'other'}))||old.quick_wins,
    scan_summary:r.scan_summary||null,
    sample_urls:r.sample_urls||null,
    // ── New data sources (extracted from raw_result) ──
    schema_detail:r.schema?{
      types_found:r.schema.types_found||[],
      has_organization:r.schema.has_organization||false,
      has_faq:r.schema.has_faq||false,
      coverage_pct:r.schema.coverage_pct||0,
      recommended:r.schema.recommended||[],
    }:null,
    page_meta:r.page?{
      title:r.page.title||'',
      meta_description:r.page.meta_description||'',
      canonical:r.page.canonical||'',
      is_ssr:r.page.technology?.is_ssr,
      framework:r.page.technology?.framework||null,
      cms:r.page.technology?.cms||null,
    }:null,
    brand_presence:r.brand?.platforms||null,
  };
}
